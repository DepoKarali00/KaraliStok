<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karali Depo</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#D4212A">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Karali Depo">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Giriş / Kayıt ekranı -->
<div id="authOverlay" class="modal-overlay auth-overlay">
  <form id="authForm" class="modal brick-modal auth-modal">
    <div class="auth-logo">
      <img src="icons/icon-192.png" alt="Karali Depo">
    </div>
    <h2 id="authTitle">Giriş Yap</h2>
    <p id="authSubtitle" class="auth-subtitle">Karali Depo'ya erişmek için giriş yap.</p>
    <label>E-posta
      <input type="email" id="authEmail" required placeholder="ornek@eposta.com" autocomplete="username">
    </label>
    <label>Şifre
      <input type="password" id="authPassword" required placeholder="En az 6 karakter" autocomplete="current-password" minlength="6">
    </label>
    <p id="authError" class="auth-error" hidden></p>
    <button type="submit" class="btn btn-primary auth-submit" id="authSubmitBtn">Giriş Yap</button>
    <button type="button" id="authToggleBtn" class="btn btn-ghost auth-toggle">Hesabın yok mu? Kayıt ol</button>
  </form>
</div>

<!-- Ana uygulama -->
<div class="baseplate" id="appRoot" hidden>

  <header class="header">
    <div class="brick logo-brick">
      <div class="studs"><span></span><span></span></div>
      <div class="brick-face">
        <h1>KARALI DEPO</h1>
        <p class="tag">stok kontrol paneli</p>
      </div>
    </div>
    <div class="header-actions">
      <span id="userEmailLabel" class="user-email"></span>
      <button id="exportJsonBtn" class="btn btn-ghost" title="JSON Yedek">⭳ JSON</button>
      <button id="exportCsvBtn" class="btn btn-ghost" title="CSV İndir">⭳ CSV</button>
      <label class="btn btn-ghost file-btn" title="Yedek Yükle">⭱ Yükle
        <input type="file" id="importInput" accept="application/json" hidden>
      </label>
      <button id="addBtn" class="btn btn-primary">+ Yeni Ürün</button>
      <button id="logoutBtn" class="btn btn-ghost">Çıkış</button>
    </div>
  </header>

  <!-- Düşük / tükenen stok uyarı bandı -->
  <div id="alertBanner" class="alert-banner" hidden></div>

  <section class="stats-row">
    <div class="brick stat-brick brick-blue">
      <div class="studs"><span></span></div>
      <div class="brick-face">
        <span class="stat-num" id="statTotal">0</span>
        <span class="stat-label">Ürün Çeşidi</span>
      </div>
    </div>
    <div class="brick stat-brick brick-green">
      <div class="studs"><span></span></div>
      <div class="brick-face">
        <span class="stat-num" id="statUnits">0</span>
        <span class="stat-label">Toplam Adet</span>
      </div>
    </div>
    <div class="brick stat-brick brick-yellow">
      <div class="studs"><span></span></div>
      <div class="brick-face">
        <span class="stat-num" id="statLow">0</span>
        <span class="stat-label">Azalan Stok</span>
      </div>
    </div>
    <div class="brick stat-brick brick-red">
      <div class="studs"><span></span></div>
      <div class="brick-face">
        <span class="stat-num" id="statOut">0</span>
        <span class="stat-label">Tükenen</span>
      </div>
    </div>
    <div class="brick stat-brick brick-black">
      <div class="studs"><span></span></div>
      <div class="brick-face">
        <span class="stat-num" id="statValue">₺0</span>
        <span class="stat-label">Stok Değeri</span>
      </div>
    </div>
  </section>

  <section class="toolbar">
    <input type="text" id="searchInput" placeholder="Ürün adı, SKU veya not ara…" class="search-input">
    <select id="categoryFilter" class="cat-select">
      <option value="">Tüm kategoriler</option>
    </select>
    <select id="statusFilter" class="cat-select">
      <option value="">Tüm durumlar</option>
      <option value="ok">Stokta</option>
      <option value="low">Azalıyor</option>
      <option value="out">Tükendi</option>
    </select>
    <select id="sortSelect" class="cat-select">
      <option value="status">Duruma göre</option>
      <option value="name">Ada göre</option>
      <option value="qty-asc">Azdan çoğa (adet)</option>
      <option value="qty-desc">Çoktan aza (adet)</option>
      <option value="price-desc">Fiyata göre</option>
    </select>
    <div class="view-toggle">
      <button id="viewGrid" class="btn btn-ghost view-btn active" title="Izgara görünümü">⊞</button>
      <button id="viewList" class="btn btn-ghost view-btn" title="Liste görünümü">☰</button>
    </div>
    <button id="refreshBtn" type="button" class="btn btn-ghost" title="Listeyi yenile">⟳</button>
  </section>

  <section id="grid" class="grid"></section>
  <p id="emptyState" class="empty-state" hidden>Henüz ürün yok. "+ Yeni Ürün" ile başla — depo bomboş bir baseplate gibi duruyor.</p>

</div>

<!-- ===================== Ürün Ekle/Düzenle Modal ===================== -->
<div id="modalOverlay" class="modal-overlay" hidden>
  <form id="productForm" class="modal brick-modal product-modal">
    <h2 id="modalTitle">Yeni Ürün</h2>
    <input type="hidden" id="productId">

    <label>Ürün adı *
      <input type="text" id="fName" required placeholder="ör. Kırmızı 2x4 Tuğla">
    </label>

    <!-- Çoklu Görsel Yükleme -->
    <label>Ürün görselleri
      <div class="image-upload-area" id="imageUploadArea">
        <div id="imageGalleryPreview" class="image-gallery-preview"></div>
        <label class="image-upload-trigger">
          <span>📷 Görsel Ekle</span>
          <small>Birden fazla seçebilirsin</small>
          <input type="file" id="fImages" accept="image/*" multiple hidden>
        </label>
        <div id="uploadProgress" class="upload-progress" hidden>
          <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
          <span id="progressText">Yükleniyor…</span>
        </div>
      </div>
    </label>

    <div class="field-row">
      <label>Ürün kodu (SKU)
        <input type="text" id="fSku" placeholder="ör. LG-2X4-RD">
      </label>
      <label>Kategori
        <input type="text" id="fCategory" list="categoryList" placeholder="ör. Bloklar">
        <datalist id="categoryList"></datalist>
      </label>
    </div>

    <div class="field-row">
      <label>Stok adedi *
        <input type="number" id="fQty" min="0" value="0" required>
      </label>
      <label>Minimum stok *
        <input type="number" id="fMin" min="0" value="5" required>
      </label>
    </div>

    <label>Birim fiyat (₺)
      <input type="number" id="fPrice" min="0" step="0.01" value="0">
    </label>

    <label>Notlar / Açıklama
      <textarea id="fNotes" rows="2" placeholder="Tedarikçi, raf kodu, özel notlar…"></textarea>
    </label>

    <div class="modal-actions">
      <button type="button" id="cancelBtn" class="btn btn-ghost modal-cancel">Vazgeç</button>
      <button type="submit" class="btn btn-primary" id="saveBtn">Kaydet</button>
    </div>
  </form>
</div>

<!-- ===================== Resim Lightbox ===================== -->
<div id="lightbox" class="lightbox" hidden>
  <button id="lightboxClose" class="lightbox-close" aria-label="Kapat">✕</button>
  <button id="lightboxPrev" class="lightbox-nav lightbox-prev" aria-label="Önceki">❮</button>
  <img id="lightboxImg" src="" alt="Ürün görseli">
  <button id="lightboxNext" class="lightbox-nav lightbox-next" aria-label="Sonraki">❯</button>
  <div id="lightboxDots" class="lightbox-dots"></div>
</div>

<!-- ===================== Stok Geçmişi Modal ===================== -->
<div id="historyOverlay" class="modal-overlay" hidden>
  <div class="modal brick-modal history-modal">
    <h2 id="historyTitle">Stok Geçmişi</h2>
    <div id="historyList" class="history-list"></div>
    <div class="modal-actions">
      <button id="historyCloseBtn" class="btn btn-ghost modal-cancel">Kapat</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<!-- Firebase Storage: çoklu görsel yükleme için -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="script.js"></script>
</body>
</html>
